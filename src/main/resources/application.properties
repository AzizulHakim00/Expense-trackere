spring.application.name=Expense Tracker
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/expense_db}
spring.mongodb.database=${MONGODB_DATABASE:expense_db}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.representation.big-decimal=decimal128
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
management.endpoints.web.exposure.include=health
spring.thymeleaf.cache=true
